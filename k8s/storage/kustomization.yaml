apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Persistent volumes, applied once and kept out of the app kustomization one
# level up. Otherwise every `kubectl apply -k k8s/` would re-apply them, and a
# `kubectl delete -k k8s/` would delete uploads, masks and the SAM3 weights
# cache along with the Deployment.
#
#   kubectl apply -k k8s/storage/     # first deploy only
namespace: sailab

resources:
  - pvc.yaml
