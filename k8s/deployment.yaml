apiVersion: apps/v1
kind: Deployment
metadata:
  name: sam3-video-service
  labels:
    app: sam3-video-service
spec:
  replicas: 1 # keep at 1: sessions live in-process memory, not shared across pods
  strategy:
    type: Recreate # avoid two pods fighting over the same GPU / PVC session state
  selector:
    matchLabels:
      app: sam3-video-service
  template:
    metadata:
      labels:
        app: sam3-video-service
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: nvidia.com/gpu.product
                    operator: In
                    values:
                      - NVIDIA-A10 #Tesla-V100-SXM2-32GB #NVIDIA-A10
                      - Tesla-V100-SXM2-32GB
                      - NVIDIA-GeForce-RTX-3090
      # CephFS volumes mount as root:root 755; the app runs as uid 1000.
      initContainers:
        - name: fix-volume-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chown 1000:1000 /data /hf-cache"]
          securityContext:
            runAsUser: 0
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: hf-cache
              mountPath: /hf-cache
      containers:
        # Authenticating gateway. Everything from outside the pod arrives here:
        # it validates the caller's Tapis token, hands back a session cookie,
        # and refuses requests for uploads or jobs belonging to another user.
        # The SAM3 container below is never published directly.
        - name: auth-gateway
          image: ghcr.io/icicle-ai/sam3-video-auth-gateway:v0.1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: sam3-video-config
            - secretRef:
                name: sam3-video-secrets
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              # Dataset export runs ffmpeg over the whole video, so this needs
              # real CPU; the proxy itself is nearly idle.
              cpu: "4"
              memory: 2Gi
          volumeMounts:
            # Ownership records sit beside the uploads they describe.
            - name: data
              mountPath: /data
          # Readiness proxies through to the video service, so the pod only
          # takes traffic once the GPU service is actually answering. That makes
          # it the readiness probe for BOTH containers — which is deliberate,
          # because the NetworkPolicy admits only 8080 and a kubelet probe
          # against 2129 may be dropped by the CNI, leaving the pod never-ready.
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          # Liveness checks only the gateway itself. Pointing it at /health
          # would restart the gateway every time the video service was slow to
          # start — a fault that is not the gateway's to answer for.
          livenessProbe:
            httpGet:
              path: /gateway/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3

        - name: sam3-video-service
          image: ghcr.io/icicle-ai/sam3-video-inference-service:v0.0.2
          imagePullPolicy: Always
          ports:
            - containerPort: 2129
              name: http
          envFrom:
            - configMapRef:
                name: sam3-video-config
            - secretRef:
                name: sam3-video-secrets
          env:
            - name: DATA_ROOT
              value: /data
            - name: HF_HOME
              value: /hf-cache
          resources:
            requests:
              cpu: "4"
              memory: 16Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: 32Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: data
              mountPath: /data
            - name: hf-cache
              mountPath: /hf-cache
            - name: dshm
              mountPath: /dev/shm
          # No httpGet probes here on purpose. Port 2129 is not published and
          # the NetworkPolicy admits only 8080, so a kubelet probe against it
          # can be dropped by the CNI and the pod would never become ready.
          # The gateway's readiness probe proxies to this service's own /health,
          # so the pod's readiness already reflects this container's state.
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sam3-video-data
        - name: hf-cache
          persistentVolumeClaim:
            claimName: sam3-hf-cache
        - name: dshm # torch DataLoader workers need more than the 64Mi default
          emptyDir:
            medium: Memory
            sizeLimit: 4Gi
