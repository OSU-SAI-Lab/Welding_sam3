apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# NRP assigns you a namespace — set it here rather than per-resource.
namespace: sailab

resources:
  - pvc.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
  # secret.yaml is git-ignored — copy from secret.example.yaml and apply separately,
  # or uncomment once it exists locally:
  # - secret.yaml
