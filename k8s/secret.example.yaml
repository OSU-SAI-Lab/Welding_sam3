# Copy to secret.yaml, fill in real values, and DO NOT commit it.
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   kubectl apply -f k8s/secret.yaml
apiVersion: v1
kind: Secret
metadata:
  name: sam3-video-secrets
type: Opaque
stringData:
  # https://huggingface.co/settings/tokens — needs access to facebook/sam3
  HF_TOKEN: "hf_***********************************"

  # Signs session cookies for the auth gateway. Generate with:
  #   python3 -c "import secrets; print(secrets.token_urlsafe(48))"
  # Changing it signs everyone out; leaving it unset refuses every request.
  SESSION_SECRET: "generate-me-see-comment-above"
