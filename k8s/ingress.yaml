# NRP (Nautilus) routes *.nrp-nautilus.io through HAProxy and serves TLS with
# its wildcard cert, so no cert-manager issuer or TLS secret is needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sam3-video-service
  annotations:
    haproxy-ingress-proxy.timeout: 600s # SSE propagate jobs and large uploads run long
    haproxy.router.openshift.io/timeout: 600s
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - sam3-video-inference-service-sailab.nrp-nautilus.io
  rules:
    - host: sam3-video-inference-service-sailab.nrp-nautilus.io
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: sam3-video-service
                port:
                  number: 80
