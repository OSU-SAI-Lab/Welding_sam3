# NRP (Nautilus) routes *.nrp-nautilus.io through HAProxy and serves TLS with
# its wildcard cert, so no cert-manager issuer or TLS secret is needed.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sam3-video-service
  annotations:
    # This cluster runs jcmoraisjr/haproxy-ingress, which reads annotations
    # under the haproxy-ingress.github.io/ prefix and ignores every other
    # spelling. The two previously set here — `haproxy-ingress-proxy.timeout`
    # and the OpenShift router's `haproxy.router.openshift.io/timeout` — were
    # silently dropped, so the default server timeout (50s) applied and
    # /chunks/prepare returned 504 on any chunk that took longer to extract.
    haproxy-ingress.github.io/timeout-server: 600s # frame extraction and SSE jobs run long
    haproxy-ingress.github.io/timeout-client: 600s # large video uploads are slow to send
    haproxy-ingress.github.io/timeout-connect: 30s
    # Source videos are large; the default cap would reject them outright.
    haproxy-ingress.github.io/proxy-body-size: 4096m
spec:
  ingressClassName: haproxy
  tls:
    - hosts:
        - sam3-video-inference-service-sailab.nrp-nautilus.io
  rules:
    - host: sam3-video-inference-service-sailab.nrp-nautilus.io
      http:
        paths:
          - path: /
            pathType: ImplementationSpecific
            backend:
              service:
                name: sam3-video-service
                port:
                  number: 80
